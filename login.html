<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Domine Português - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="main.css"/>
</head>
<body id="page-login">

  <div class="login-wallpaper"></div>

  <main class="login-glass-panel">
    
    <img src="logo.jpg" alt="Domine Português" class="login-logo"/>
    
    <div class="tab-buttons">
      <button id="tab-login" class="tab-active">Entrar</button>
      <button id="tab-register">Criar conta</button>
    </div>

      <form id="loginForm" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="emailLogin">E-mail</label>
        <input type="email" id="emailLogin" name="emailLogin" required autocomplete="username" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label for="passwordLogin">Senha</label>
        <input type="password" id="passwordLogin" name="passwordLogin" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="error-msg" id="loginError"></p>
    </form>

      <form id="registerForm" class="login-form hidden" autocomplete="off">
      <div class="form-group">
        <label for="nameRegister">Nome completo</label>
        <input type="text" id="nameRegister" name="nameRegister" required autocomplete="name"/>
      </div>
      <div class="form-group">
        <label for="emailRegister">E-mail</label>
        <input type="email" id="emailRegister" name="emailRegister" required autocomplete="email" placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label for="passwordRegister">Senha</label>
        <input type="password" id="passwordRegister" name="passwordRegister" required placeholder="Mínimo 6 caracteres"/>
      </div>
      <div class="form-group">
        <label for="codeTurma">Código da Turma</label>
        <input type="text" id="codeTurma" name="codeTurma" required/>
      </div>
      <button type="submit" class="btn-primary">Criar conta</button>
      <p class="error-msg" id="registerError"></p>
      <p class="success-msg" id="registerSuccess"></p>
    </form>
    
    <p class="form-divider">ou</p>

    <button id="googleLoginBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.20455C17.64 8.56682 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5609V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/>
        <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5609C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.96273 14.4205 5.22091 13.0173 4.63909 11.1668H1.61636V13.5009C3.10636 16.2659 5.82273 18 9 18Z" fill="#34A853"/>
        <path d="M4.63909 11.1668C4.43091 10.5291 4.31591 9.84545 4.31591 9.13636C4.31591 8.42727 4.43091 7.74364 4.63909 7.10591V4.77182H1.61636C0.973636 6.00273 0.6 7.42591 0.6 9.13636C0.6 10.8468 0.973636 12.2695 1.61636 13.5005L4.63909 11.1668Z" fill="#FBBC05"/>
        <path d="M9 3.85227C10.3273 3.85227 11.5073 4.28818 12.4809 5.20591L15.0218 2.66455C13.4673 1.19727 11.43 0.272727 9 0.272727C5.82273 0.272727 3.10636 2.00727 1.61636 4.77227L4.63909 7.10591C5.22091 5.25545 6.96273 3.85227 9 3.85227Z" fill="#EA4335"/>
      </svg>
      <span>Continuar com Google</span>
    </button>
  </main>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
