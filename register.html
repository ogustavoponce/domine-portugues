<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Domine Português - Cadastro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- Trava de cache v=final2 -->
  <link rel="stylesheet" href="style.css?v=final2"/>
</head>
<body id="page-register">

  <div class="login-wallpaper"></div>

  <main class="login-glass-panel">
    <img src="logo.jpg" alt="Domine Português" class="login-logo"/>
    <h1 class="login-title">Crie sua conta</h1>
    <p class="login-subtitle">Junte-se à nossa plataforma</p>

    <form id="registerForm" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="nameRegister">Nome completo</label>
        <input type="text" id="nameRegister" required placeholder="Seu nome"/>
      </div>
      <div class="form-group">
        <label for="emailRegister">E-mail</label>
        <input type="email" id="emailRegister" required placeholder="seu@email.com"/>
      </div>
      <div class="form-group">
        <label for="passwordRegister">Senha</label>
        <input type="password" id="passwordRegister" required placeholder="Mínimo 6 caracteres"/>
      </div>
      <div class="form-group">
        <label for="codeTurma">Código da Turma</label>
        <input type="text" id="codeTurma" required placeholder="Ex: TURMA2025"/>
      </div>
      
      <p class="error-msg" id="registerError"></p>
      <button type="submit" class="btn-primary">Criar Conta</button>
    </form>
    
    <p class="form-link">
      Já tem uma conta? <a href="login.html">Faça login</a>
    </p>
  </main>

  <footer class="dp-footer">© 2025 Domine Português</footer>
  
  <script type="module" src="js/main.js"></script>

  <head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>...</title>
  
  <link rel="icon" href="favicon.jpg" type="image/jpeg"/>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=final2"/>
</head>

</body>
</html>
