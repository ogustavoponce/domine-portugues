<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domine Português | IFPR</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.jpg" type="image/jpg">

    <!-- Fontes (Inter e SF Pro Display concept) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container de Notificações -->
    <div id="toast-container"></div>

    <!-- Fundo Animado (Azul da Identidade) -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="glass-mesh"></div>
    </div>

    <!-- === TELA DE LOGIN / CADASTRO === -->
    <div id="auth-view" class="view-container active">
        <div class="glass-card fade-in auth-card-size">
            <div class="logo-area">
                <!-- Sua Logo Aqui -->
                <img src="logo.jpg" alt="Domine Português Logo" class="auth-logo">
            </div>
            
            <h1 id="auth-title">Bem-vindo</h1>
            <p class="subtitle" id="auth-subtitle">Sua plataforma completa de ensino.</p>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="login-email" placeholder="E-mail Institucional" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="login-pass" placeholder="Senha" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    <span>Acessar Plataforma</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form (Oculto inicialmente) -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <i class="ph ph-user"></i>
                    <input type="text" id="reg-name" placeholder="Nome Completo" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="reg-email" placeholder="E-mail" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="ph ph-student"></i>
                    <input type="text" id="reg-class-code" placeholder="Código da Turma (Ex: IFPR-3A)" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="reg-pass" placeholder="Criar Senha" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Criar Conta</button>
            </form>

            <div class="divider">ou entre com</div>

            <div class="social-buttons">
                <button id="btn-google" class="btn btn-social">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" width="20">
                    Google
                </button>
                <button id="btn-apple" class="btn btn-social">
                    <i class="ph ph-apple-logo" style="font-size: 20px; color: #000;"></i>
                    Apple
                </button>
            </div>

            <p class="switch-text">
                <span id="text-switch">Não tem conta?</span> 
                <a href="#" id="btn-toggle-auth">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- === TELA DO APP (DASHBOARD) === -->
    <div id="app-view" class="view-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <img src="logo.jpg" alt="Logo" class="sidebar-logo">
                <span>Domine<br>Português</span>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item active" data-target="home">
                    <i class="ph ph-house"></i> <span>Início</span>
                </div>
                <div class="nav-item" data-target="classes">
                    <i class="ph ph-chalkboard-teacher"></i> <span>Aulas e Materiais</span>
                </div>
                <div class="nav-item" data-target="chat">
                    <i class="ph ph-chat-circle-dots"></i> <span>Chat da Turma</span>
                </div>
            </nav>

            <div class="user-profile" id="btn-logout" title="Sair">
                <div class="avatar" id="user-avatar">U</div>
                <div class="user-info">
                    <span class="name" id="user-name">...</span>
                    <span class="role" id="user-role">...</span>
                </div>
                <i class="ph ph-sign-out logout-icon"></i>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="mobile-header glass-panel">
                <img src="logo.jpg" alt="Logo" style="height: 30px;">
                <button id="mobile-menu-toggle"><i class="ph ph-list"></i></button>
            </header>

            <div id="dynamic-content">
                <!-- Conteúdo injetado via JS -->
            </div>
        </main>
    </div>

    <!-- Lógica (Módulo) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
