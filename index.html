<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domine Português | IFPR</title>
    
    <!-- Fontes (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Ícones (Phosphor Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container de Notificações -->
    <div id="toast-container"></div>

    <!-- Fundo Animado -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- === TELA DE LOGIN / CADASTRO === -->
    <div id="auth-view" class="view-container active">
        <div class="glass-card fade-in">
            <div class="logo-area">
                <i class="ph ph-books duotone" style="font-size: 48px; color: var(--primary);"></i>
            </div>
            
            <h1 id="auth-title">Bem-vindo</h1>
            <p class="subtitle" id="auth-subtitle">Acesse a plataforma de ensino.</p>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="login-email" placeholder="E-mail" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="login-pass" placeholder="Senha" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <!-- Register Form (Oculto inicialmente) -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <i class="ph ph-user"></i>
                    <input type="text" id="reg-name" placeholder="Nome Completo" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="reg-email" placeholder="E-mail" required autocomplete="email">
                </div>
                <div class="input-group">
                    <i class="ph ph-student"></i>
                    <input type="text" id="reg-class-code" placeholder="Código da Turma (Ex: TURMA-A)" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="reg-pass" placeholder="Senha (min. 6 caracteres)" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Criar Conta</button>
            </form>

            <div class="divider">ou</div>

            <button id="btn-google" class="btn btn-social">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" width="20">
                Entrar com Google
            </button>

            <p class="switch-text">
                <span id="text-switch">Não tem conta?</span> 
                <a href="#" id="btn-toggle-auth">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- === TELA DO APP (DASHBOARD) === -->
    <div id="app-view" class="view-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i class="ph ph-books" style="color: var(--primary);"></i>
                <span>Domine<br>Português</span>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item active" data-target="home">
                    <i class="ph ph-house"></i> <span>Início</span>
                </div>
                <div class="nav-item" data-target="classes">
                    <i class="ph ph-chalkboard-teacher"></i> <span>Aulas</span>
                </div>
                <div class="nav-item" data-target="chat">
                    <i class="ph ph-chat-circle-dots"></i> <span>Chat</span>
                </div>
            </nav>

            <div class="user-profile" id="btn-logout" title="Sair">
                <div class="avatar" id="user-avatar">U</div>
                <div class="user-info">
                    <span class="name" id="user-name">Carregando...</span>
                    <span class="role" id="user-role">Aluno</span>
                </div>
                <i class="ph ph-sign-out logout-icon"></i>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="mobile-header glass-panel">
                <span class="brand-mobile">Domine Português</span>
                <button id="mobile-menu-toggle"><i class="ph ph-list"></i></button>
            </header>

            <div id="dynamic-content">
                <!-- Conteúdo injetado via JS -->
            </div>
        </main>
    </div>

    <!-- Lógica (Módulo) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
