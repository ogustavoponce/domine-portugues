<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Plataforma - Domine Português</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=fix"/>
  <link rel="icon" href="favicon.jpg" type="image/jpeg"/>
</head>
<body id="page-app">

  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header" style="text-align: center;">
        <img src="logo.jpg" alt="Domine Português" class="dp-logo" style="max-height: 50px; width: auto; display: block; margin: 0 auto;"/>
      </div>
      
      <div class="sidebar-profile">
        <div class="sidebar-avatar" style="color: #114060;">U</div>
        <div class="sidebar-info">
          <div class="user-name">Carregando...</div>
          <div class="user-role">Aluno</div>
        </div>
      </div>

      <nav class="sidebar-nav" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
        <a href="#turmas" class="active">📚 Minhas Turmas</a>
        <a href="#apostilas">📄 Apostilas</a>
        </nav>

      <button id="btnLogout" style="margin-top: auto; color: #d93025; background: none; border: 1px solid #d93025; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold;">Sair</button>
    </aside>

    <main class="main-content">
      <h2 class="main-header">Bem-vindo ao Domine Português</h2>
      <div id="dynamic-content">
        <p>Carregando painel...</p>
      </div>
    </main>
  </div>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
