<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma de Ensino</title>
    
    <!-- Ícone da Aba -->
    <link rel="shortcut icon" href="favicon.jpg" type="image/jpeg">
    
    <!-- Fontes Modernas (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca de Ícones -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Estilo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Notificações -->
    <div id="toast-container"></div>

    <!-- === TELA DE LOGIN / CADASTRO === -->
    <div id="auth-view" class="view-wrapper active">
        <div class="auth-card fade-in">
            <!-- LOGO EM DESTAQUE -->
            <div class="logo-area">
                <img src="logo.jpg" alt="Logo da Plataforma" class="main-logo">
            </div>

            <!-- Abas de Navegação -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
            </div>

            <!-- Formulário de Login -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="login-email" placeholder="E-mail" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="login-pass" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-primary">Acessar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <i class="ph ph-user"></i>
                    <input type="text" id="reg-name" placeholder="Nome Completo" required>
                </div>
                <div class="input-group">
                    <i class="ph ph-envelope-simple"></i>
                    <input type="email" id="reg-email" placeholder="E-mail" required>
                </div>
                <!-- Código da turma removido do cadastro inicial para simplificar. 
                     O aluno insere depois no painel. -->
                <div class="input-group">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="reg-pass" placeholder="Criar Senha" required minlength="6">
                </div>
                <button type="submit" class="btn-primary">Criar Conta</button>
            </form>

            <div class="divider">ou continue com</div>

            <!-- Botão Google -->
            <button id="btn-google" class="btn-social">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span>Google</span>
            </button>
        </div>
    </div>

    <!-- === PAINEL DO SISTEMA (DASHBOARD) === -->
    <div id="app-view" class="view-wrapper">
        
        <!-- Sidebar (Menu Lateral) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="logo.jpg" alt="Logo" class="sidebar-logo">
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-page="home">
                    <i class="ph ph-squares-four"></i> Início
                </button>
                
                <!-- Menu Exclusivo do Professor -->
                <div id="admin-menu" class="hidden">
                    <span class="menu-label">GESTÃO</span>
                    <button class="nav-item" data-page="classes"><i class="ph ph-chalkboard-teacher"></i> Turmas</button>
                    <button class="nav-item" data-page="students"><i class="ph ph-users"></i> Alunos</button>
                </div>

                <!-- Menu Exclusivo do Aluno -->
                <div id="student-menu" class="hidden">
                    <span class="menu-label">ESTUDOS</span>
                    <button class="nav-item" data-page="classroom"><i class="ph ph-graduation-cap"></i> Minha Sala</button>
                </div>

                <div class="spacer"></div>
                <button class="nav-item" data-page="profile">
                    <i class="ph ph-user-gear"></i> Perfil
                </button>
            </nav>

            <div class="user-footer">
                <div class="user-info">
                    <strong id="u-name">Usuário</strong>
                    <span id="u-role">Carregando...</span>
                </div>
                <button id="btn-logout" title="Sair"><i class="ph ph-sign-out"></i></button>
            </div>
        </aside>

        <!-- Área de Conteúdo -->
        <main class="main-content">
            <header class="top-bar">
                <button id="mobile-toggle"><i class="ph ph-list"></i></button>
                <h2 id="page-title">Visão Geral</h2>
            </header>
            
            <div id="content-area" class="content-body fade-in">
                <!-- O conteúdo entra aqui via JavaScript -->
            </div>
        </main>
    </div>

    <!-- === MODAL (Popups) === -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="generic-modal" class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Título</h3>
                <button onclick="closeModal()"><i class="ph ph-x"></i></button>
            </div>
            <div id="modal-body">
                <!-- Conteúdo do modal injetado via JS -->
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
