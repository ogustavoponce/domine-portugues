<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domine Português - Plataforma de Ensino</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=3.0">
    <!-- Favicon -->
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- TELA DE AUTENTICAÇÃO (Login/Cadastro) -->
    <div id="auth-container">
        <div class="auth-card">
            <img src="logo.jpg" alt="Domine Português" class="auth-logo">
            
            <!-- Formulário de Login -->
            <div id="loginView">
                <h2 class="auth-title">Bem-vindo</h2>
                <p class="auth-subtitle">Faça login para acessar a plataforma.</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail">E-mail</label>
                        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Senha</label>
                        <input type="password" id="loginPassword" placeholder="Sua senha" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Entrar</button>
                </form>

                <div class="divider"><span>ou continue com</span></div>

                <div class="social-login">
                    <button id="googleLoginBtn" class="btn btn-social">
                        <i class="fab fa-google" style="color: #DB4437;"></i> Google
                    </button>
                    <!-- Botão Apple (Visual) -->
                    <button class="btn btn-social">
                         <i class="fab fa-apple"></i> Apple
                    </button>
                </div>

                <div class="auth-footer">
                    Não tem uma conta? <a class="auth-link" onclick="app.showRegister()">Cadastre-se</a>
                </div>
            </div>

            <!-- Formulário de Cadastro -->
            <div id="registerView" class="hidden">
                <h2 class="auth-title">Criar Conta</h2>
                <p class="auth-subtitle">Junte-se à turma do Prof. Domenico</p>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="regName">Nome Completo</label>
                        <input type="text" id="regName" placeholder="Seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">E-mail</label>
                        <input type="email" id="regEmail" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Senha</label>
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="regCode">Código da Turma</label>
                        <input type="text" id="regCode" placeholder="Ex: INFO1" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Cadastrar</button>
                </form>

                <div class="auth-footer">
                    Já tem uma conta? <a class="auth-link" onclick="app.showLogin()">Faça Login</a>
                </div>
            </div>

        </div>
    </div>

    <!-- PAINEL DO APLICATIVO (Dashboard) -->
    <div id="app-container" class="hidden">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-book-reader mr-2"></i> Domine Português
            </div>
            
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Links injetados via JS -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini-profile">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-info-text">
                        <span class="user-name" id="userNameDisplay">Usuário</span>
                        <span class="user-role" id="userRoleDisplay">Aluno</span>
                    </div>
                </div>
                <button id="logoutBtn" class="btn btn-outline w-full btn-sm" style="color: #fff; border-color: #555;">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header class="top-header">
                <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="header-actions">
                    <!-- Espaço para notificações ou busca futura -->
                </div>
            </header>

            <main class="content-area" id="mainContent">
                <!-- Conteúdo dinâmico carregado aqui -->
                <h2>Carregando...</h2>
            </main>
        </div>

    </div>

    <!-- Lógica Principal -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
