<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domine Português</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-container" class="auth-wrapper">
        <div class="auth-card glass-panel">
            <img src="logo.jpg" alt="Logo" class="auth-logo">
            <h2>Bem-vindo</h2>
            <p class="auth-subtitle">Sua jornada começa aqui.</p>

            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="E-mail" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
            </form>

            <div style="margin: 20px 0; font-size: 0.8rem; color: #888;">OU</div>

            <button id="btn-google" class="btn btn-google" style="width:100%">
                <span style="font-weight:bold; color:#4285F4">G</span> Continuar com Google
            </button>
        </div>
    </div>

    <div id="app-container" class="app-layout hidden">
        
        <aside class="sidebar glass-panel">
            <div class="sidebar-header" style="text-align:center;">
                <img src="logo.jpg" class="sidebar-logo">
            </div>
            
            <nav style="flex:1;">
                <a href="#" class="nav-link active" data-target="dashboard">
                    <i>📊</i> <span>Dashboard</span>
                </a>
                <a href="#" class="nav-link" data-target="classroom">
                    <i>🎓</i> <span>Sala de Aula</span>
                </a>
                
                <div id="admin-menu" class="hidden">
                    <div style="margin: 20px 0 10px 15px; font-size: 0.7rem; color: #999; font-weight:700;">GESTÃO</div>
                    <a href="#" class="nav-link" data-target="admin-classes">
                        <i>🏫</i> <span>Turmas</span>
                    </a>
                    <a href="#" class="nav-link" data-target="admin-students">
                        <i>👥</i> <span>Alunos</span>
                    </a>
                </div>
            </nav>

            <a href="#" class="nav-link" data-target="profile">
                <i>👤</i> <span>Perfil</span>
            </a>
            <a href="#" id="btn-logout" class="nav-link" style="color:#FF3B30;">
                <i>🚪</i> <span>Sair</span>
            </a>
        </aside>

        <main class="main-content glass-panel">
            
            <section id="dashboard" class="view-section active">
                <header class="section-header">
                    <h1>Visão Geral</h1>
                    <p>Seus horários e compromissos.</p>
                </header>
                <div class="card">
                    <div class="card-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <h3>Horário Semanal</h3>
                        <button id="btn-save-schedule" class="btn btn-primary hidden" style="padding:6px 12px; font-size:0.8rem;">Salvar</button>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="table">
                            <thead><tr><th>SEG</th><th>TER</th><th>QUA</th><th>QUI</th><th>SEX</th></tr></thead>
                            <tbody id="schedule-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="admin-classes" class="view-section hidden">
                <header class="section-header" style="display:flex; justify-content:space-between;">
                    <h1>Turmas</h1>
                    <button id="btn-new-class" class="btn btn-primary">+ Criar</button>
                </header>
                <div id="classes-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:15px;"></div>
            </section>

            <section id="admin-students" class="view-section hidden">
                <header class="section-header"><h1>Alunos</h1></header>
                <div class="card">
                    <table class="table">
                        <thead><tr><th>Nome</th><th>Email</th><th>Turma</th><th>Ações</th></tr></thead>
                        <tbody id="students-list"></tbody>
                    </table>
                </div>
            </section>

            <section id="classroom" class="view-section hidden">
                <header class="section-header" style="display:flex; justify-content:space-between;">
                    <h1 id="classroom-title">Mural</h1>
                    <button id="btn-new-post" class="btn btn-primary hidden">+ Novo Aviso</button>
                </header>
                <div id="posts-container"></div>
            </section>

            <section id="profile" class="view-section hidden">
                <header class="section-header"><h1>Perfil</h1></header>
                <div class="card" style="max-width:500px;">
                    <div class="input-group">
                        <label>Nome</label>
                        <input type="text" id="profile-name">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="text" id="profile-email" disabled style="opacity:0.6;">
                    </div>
                    <div class="input-group">
                        <label>Código da Turma</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="profile-class-code" placeholder="Ex: PORT3A">
                            <button id="btn-join-class" class="btn btn-secondary">Entrar</button>
                        </div>
                    </div>
                    <button id="btn-update-profile" class="btn btn-primary" style="margin-top:20px;">Salvar Alterações</button>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
