<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domine Português | Área do Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-container" class="auth-container">
        <div class="auth-card fade-in">
            <img src="logo.jpg" alt="Domine Português" class="auth-logo">
            <h2 style="margin-bottom: 8px;">Bem-vindo</h2>
            <p style="color:var(--text-secondary); margin-bottom: 24px; font-size: 14px;">Entre para acessar seus conteúdos.</p>

            <form id="login-form">
                <input type="email" id="login-email" class="input-ios" placeholder="Seu e-mail" required>
                <input type="password" id="login-password" class="input-ios" placeholder="Sua senha" required>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
            </form>

            <div style="margin: 20px 0; font-size: 12px; color: #ccc; text-transform: uppercase;">ou</div>

            <button id="btn-google" class="btn btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.26.81-.58z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Entrar com Google
            </button>
        </div>
    </div>

    <div id="app-container" class="app-shell hidden">
        
        <nav class="sidebar">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="logo.jpg" style="width: 50px; border-radius: 12px;">
            </div>

            <a href="#" class="nav-item active" data-target="dashboard">
                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Agenda & Horários</span>
            </a>
            
            <a href="#" class="nav-item" data-target="classroom">
                <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 1-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                <span>Mural da Turma</span>
            </a>

            <div id="admin-menu" class="hidden">
                <div style="margin: 20px 0 8px 16px; font-size: 11px; font-weight: 700; color: #C7C7CC; letter-spacing: 1px;">ADMIN</div>
                <a href="#" class="nav-item" data-target="admin-classes">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span>Turmas</span>
                </a>
                <a href="#" class="nav-item" data-target="admin-students">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                    <span>Alunos</span>
                </a>
            </div>

            <div style="flex: 1;"></div>

            <a href="#" class="nav-item" data-target="profile">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Meu Perfil</span>
            </a>
            <a href="#" id="btn-logout" class="nav-item" style="color: #FF3B30;">
                <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Sair</span>
            </a>
        </nav>

        <main class="main-view fade-in">
            
            <section id="dashboard" class="view-section">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Grade Semanal</h1>
                        <p style="color:var(--text-secondary)">Acompanhe aulas e atendimentos.</p>
                    </div>
                    <button id="btn-save-schedule" class="btn btn-primary hidden">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Salvar Alterações
                    </button>
                </div>

                <div id="schedule-grid" class="schedule-container">
                    </div>
            </section>

            <section id="classroom" class="view-section hidden">
                <div class="page-header">
                    <h1 class="page-title">Mural de Avisos</h1>
                    <button id="btn-new-post" class="btn btn-primary hidden">+ Novo Aviso</button>
                </div>
                <div id="posts-container"></div>
            </section>

            <section id="profile" class="view-section hidden">
                <h1 class="page-title">Perfil</h1>
                <div style="max-width: 400px; margin-top: 20px;">
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 10px;">SEU NOME</label>
                    <input type="text" id="profile-name" class="input-ios">
                    
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 10px;">SEU EMAIL</label>
                    <input type="text" id="profile-email" class="input-ios" disabled style="opacity: 0.6;">

                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-left: 10px;">CÓDIGO DA TURMA</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="profile-class-code" class="input-ios" placeholder="Digite o código">
                        <button id="btn-join-class" class="btn btn-primary" style="height: 52px; border-radius: 14px;">Entrar</button>
                    </div>

                    <button id="btn-update-profile" class="btn" style="background: #E5E5EA; color: var(--text-primary); margin-top: 20px;">Salvar Nome</button>
                </div>
            </section>

            <section id="admin-classes" class="view-section hidden">
                <div class="page-header">
                    <h1 class="page-title">Gestão de Turmas</h1>
                    <button id="btn-new-class" class="btn btn-primary">Nova Turma</button>
                </div>
                <div id="classes-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;"></div>
            </section>

            <section id="admin-students" class="view-section hidden">
                <h1 class="page-title">Alunos Cadastrados</h1>
                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <thead><tr style="text-align: left; color: var(--text-secondary); font-size: 12px; border-bottom: 1px solid #E5E5EA;">
                        <th style="padding: 10px;">NOME</th><th style="padding: 10px;">EMAIL</th><th style="padding: 10px;">TURMA</th><th></th>
                    </tr></thead>
                    <tbody id="students-list"></tbody>
                </table>
            </section>

        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
