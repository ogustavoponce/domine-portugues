<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Domine Português | Gestão</title>
    
    <link rel="shortcut icon" href="favicon.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-container"></div>

    <!-- TELA DE LOGIN -->
    <div id="auth-view" class="view-container active">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-brand">
                    <img src="logo.jpg" class="logo-img" onerror="this.style.display='none'">
                    <div>
                        <h1>Domine Português</h1>
                        <p>Plataforma de Gestão Escolar</p>
                    </div>
                </div>

                <div class="tabs-auth">
                    <button class="tab-btn active" onclick="toggleTab('login')">Entrar</button>
                    <button class="tab-btn" onclick="toggleTab('register')">Cadastrar</button>
                </div>

                <form id="login-form">
                    <div class="input-wrap">
                        <i class="ph ph-envelope"></i>
                        <input type="email" id="login-email" placeholder="E-mail" required>
                    </div>
                    <div class="input-wrap">
                        <i class="ph ph-lock-key"></i>
                        <input type="password" id="login-pass" placeholder="Senha" required>
                    </div>
                    <button type="submit" class="btn-primary">Acessar Painel</button>
                </form>

                <form id="register-form" class="hidden">
                    <div class="input-wrap"><i class="ph ph-user"></i><input type="text" id="reg-name" placeholder="Nome Completo" required></div>
                    <div class="input-wrap"><i class="ph ph-envelope"></i><input type="email" id="reg-email" placeholder="E-mail" required></div>
                    <div class="input-wrap"><i class="ph ph-hash"></i><input type="text" id="reg-code" placeholder="Código da Turma" required></div>
                    <div class="input-wrap"><i class="ph ph-lock-key"></i><input type="password" id="reg-pass" placeholder="Senha" required minlength="6"></div>
                    <button type="submit" class="btn-primary">Criar Conta</button>
                </form>

                <div class="divider">Acesso Rápido</div>
                <div class="social-row">
                    <button id="btn-google" class="btn-social" style="width: 100%"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Entrar com Google</button>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA DO SISTEMA -->
    <div id="app-view" class="view-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><i class="ph ph-books"></i></div>
                <span>Domine<br>Português</span>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-target="home"><i class="ph ph-squares-four"></i> Visão Geral</button>
                <button class="nav-item" data-target="profile"><i class="ph ph-user-gear"></i> Meu Perfil</button>
                
                <!-- Admin -->
                <div id="admin-menu" class="hidden">
                    <div class="nav-label">GESTÃO TOTAL</div>
                    <button class="nav-item" data-target="admin-classes"><i class="ph ph-chalkboard-teacher"></i> Gerir Turmas</button>
                    <button class="nav-item" data-target="admin-students"><i class="ph ph-users-three"></i> Gerir Alunos</button>
                </div>
                
                <!-- Aluno -->
                <div id="student-menu" class="hidden">
                    <div class="nav-label">AULAS</div>
                    <button class="nav-item" data-target="classroom"><i class="ph ph-graduation-cap"></i> Minha Sala</button>
                </div>
            </nav>

            <div class="user-bar">
                <div class="avatar" id="user-avatar">U</div>
                <div class="user-info">
                    <strong id="user-name">...</strong>
                    <span id="user-role">...</span>
                </div>
                <button id="btn-logout" class="icon-btn"><i class="ph ph-sign-out"></i></button>
            </div>
        </aside>

        <!-- Conteúdo -->
        <main class="content-wrapper">
            <header class="top-bar">
                <button id="mobile-toggle"><i class="ph ph-list"></i></button>
                <h2 id="page-title">Dashboard</h2>
            </header>
            <div id="dynamic-content" class="content-body fade-in"></div>
        </main>
    </div>

    <!-- MODAIS DE GESTÃO -->
    <div id="modal-overlay" class="modal-overlay hidden">
        
        <!-- Editar/Criar Turma -->
        <div id="modal-class" class="modal-card hidden">
            <h3 id="modal-class-title">Dados da Turma</h3>
            <input type="hidden" id="class-id"> <!-- ID para edição -->
            <label>Nome da Turma</label>
            <input type="text" id="cls-name" class="input-std">
            <label>Código de Acesso</label>
            <input type="text" id="cls-code" class="input-std">
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModals()">Cancelar</button>
                <button class="btn-primary" onclick="saveClassAction()">Salvar</button>
            </div>
        </div>

        <!-- Editar Aluno (Admin) -->
        <div id="modal-student" class="modal-card hidden">
            <h3>Editar Aluno</h3>
            <input type="hidden" id="edit-uid">
            <label>Nome Completo</label>
            <input type="text" id="edit-name" class="input-std">
            <label>E-mail (Apenas visualização)</label>
            <input type="text" id="edit-email" class="input-std" disabled style="background:#eee">
            <label>Mover para Turma:</label>
            <select id="edit-class-select" class="input-std"></select>
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModals()">Cancelar</button>
                <button class="btn-primary" onclick="saveStudentAction()">Atualizar Aluno</button>
            </div>
        </div>

        <!-- Postagem -->
        <div id="modal-post" class="modal-card hidden">
            <h3>Novo Conteúdo</h3>
            <label>Título</label>
            <input type="text" id="post-title" class="input-std">
            <label>Tipo</label>
            <select id="post-type" class="input-std">
                <option value="aviso">📢 Aviso</option>
                <option value="material">📚 Material</option>
                <option value="atividade">📝 Atividade</option>
            </select>
            <label>Conteúdo</label>
            <textarea id="post-body" rows="4" class="input-std"></textarea>
            <label>Link Externo</label>
            <input type="text" id="post-link" class="input-std" placeholder="https://...">
            <div class="modal-actions">
                <button class="btn-text" onclick="closeModals()">Cancelar</button>
                <button class="btn-primary" onclick="publishPost()">Publicar</button>
            </div>
        </div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
